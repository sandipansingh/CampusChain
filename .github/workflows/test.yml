# test.yml
#
# Triggered on push to `main` and on pull requests targeting `main`.
# Runs unit and integration tests for both Smart Contracts (Rust/Soroban) and Frontend (Next.js/Vitest).
#
# No secrets required for this workflow.
name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-test:
    name: "Contracts — unit tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to the same toolchain version used locally (stable + wasm32).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run contract unit tests
        run: cargo test

  frontend-test:
    name: "Frontend — vitest unit & integration tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      # Vitest runs in headless jsdom mode — no Freighter popup, no network calls.
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test
